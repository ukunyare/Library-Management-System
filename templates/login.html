{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}
{% block auth_content %}
<div class="w-full max-w-md animate-fade-in">
  <div class="mb-8 text-center">
    <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-600 text-white shadow-xl shadow-brand-600/30">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-7 w-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
      </svg>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900">Welcome to BookWise</h1>
    <p class="mt-1 text-sm text-slate-500">Sign in to manage your library</p>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-card">
    <form method="post" class="space-y-5" novalidate>
      <div>
        <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700">Username</label>
        <div class="relative">
          <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
            </svg>
          </span>
          <input type="text" id="username" name="username" required autofocus
                 placeholder="admin"
                 class="input w-full rounded-lg border border-slate-300 bg-slate-50 py-2.5 pl-10 pr-3 text-sm outline-none ring-brand-500 transition focus:bg-white focus:ring-2">
        </div>
      </div>

      <div>
        <div class="mb-1.5 flex items-center justify-between">
          <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
        </div>
        <div class="relative">
          <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
            </svg>
          </span>
          <input type="password" id="password" name="password" required placeholder="••••••••"
                 class="input w-full rounded-lg border border-slate-300 bg-slate-50 py-2.5 pl-10 pr-3 text-sm outline-none ring-brand-500 transition focus:bg-white focus:ring-2">
        </div>
      </div>

      <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-600">
        <input type="checkbox" name="remember" class="h-4 w-4 rounded border-slate-300 accent-brand-600">
        Remember me
      </label>

      <button type="submit"
              class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-brand-600/25 transition-all hover:bg-brand-700 active:scale-[0.98]">
        Sign In
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </button>
    </form>
  </div>

  <p class="mt-6 text-center text-xs text-slate-400">
    Default credentials &middot; username: <code class="font-mono font-semibold text-slate-500">admin</code> &middot; password: <code class="font-mono font-semibold text-slate-500">admin123</code>
  </p>
</div>
{% endblock %}
