{% macro availability(book) %}
  {% if book.available_copies == 0 %}
  <span class="inline-flex items-center rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-bold text-red-700">Out of stock</span>
  {% elif book.available_copies <= 2 %}
  <span class="inline-flex items-center rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-bold text-amber-700">{{ book.available_copies }} left</span>
  {% else %}
  <span class="inline-flex items-center rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-bold text-emerald-700">{{ book.available_copies }} available</span>
  {% endif %}
{% endmacro %}
